name: Build and publish application

on:
  push:
    branches:
      - trunk
    tags:
      - v*

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: europe-west1-c
  IMAGE_APP: todo_app
  IMAGE_BACKEND: todo_backend

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish
        run: |-
          docker build -t "viksil/$IMAGE_BACKEND:$GITHUB_SHA" ./todo_backend
          docker push "viksil/$IMAGE_BACKEND:$GITHUB_SHA"    
          docker build -t "viksil/$IMAGE_APP:$GITHUB_SHA" ./todo_app
          docker push "viksil/$IMAGE_APP:$GITHUB_SHA" 


  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: 'Log into Google Cloud'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GKE_SA_KEY }}'

      - name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@v2

      - name: 'Use gcloud CLI'
        run: gcloud info

      - name: 'Enable Google Container Registry'
        run: gcloud --quiet auth configure-docker

      - name: 'Get GKE credentials'
        uses: 'google-github-actions/get-gke-credentials@v2'
        with:
          cluster_name: '${{ env.GKE_CLUSTER }}'
          project_id: '${{ env.PROJECT_ID }}'
          location: '${{ env.GKE_ZONE }}'

      - name: Checkout config
        uses: actions/checkout@v4
        with:
          repository: VikSil/HU_MOOC_todo_app_config
          token:  ${{ secrets.GH_TOKEN }}
          path: deployment
          persist-credentials: true



      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2
        
      - name: Set up manifests for staging
        if: github.ref == 'refs/heads/trunk'
        run: |-
          cd deployment/overlays/staging
          kubectl create namespace staging --dry-run=client -o yaml | kubectl apply -f -
          kubectl config set-context --current --namespace=staging
          kustomize edit set namespace staging
          kustomize edit set image PROJECT/IMAGE_BACKEND="viksil/$IMAGE_BACKEND:$GITHUB_SHA"
          kustomize edit set image PROJECT/IMAGE_APP="viksil/$IMAGE_APP:$GITHUB_SHA"
          kustomize build .

      - name: Set up manifests for production
        if: startsWith(github.ref, 'refs/tags/')
        run: |-
          cd deployment/overlays/prod
          kubectl create namespace production --dry-run=client -o yaml | kubectl apply -f -
          kubectl config set-context --current --namespace=production
          kustomize edit set namespace production
          kustomize edit set image PROJECT/IMAGE_BACKEND="viksil/$IMAGE_BACKEND:$GITHUB_SHA"
          kustomize edit set image PROJECT/IMAGE_APP="viksil/$IMAGE_APP:$GITHUB_SHA"
          kustomize build .

      - name: Commit and push changes
        run: |
          cd deployment
          git config --global user.name "VikSil"
          git config --global user.email "VikSil@users.noreply.github.com"
          git add .
          git commit -m "Update staging kustomization to ${{ github.sha }}"
          git push
